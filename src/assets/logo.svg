<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Gradient background panel for visual luxury -->
  <rect width="100" height="100" rx="20" fill="#111827" />
  
  <!-- Subtle architectural grid guides in the background -->
  <line x1="20" y1="20" x2="80" y2="20" stroke="rgba(255,255,255,0.06)" stroke-width="0.75" stroke-dasharray="2 2" />
  <line x1="20" y1="50" x2="80" y2="50" stroke="rgba(255,255,255,0.06)" stroke-width="0.75" stroke-dasharray="2 2" />
  <line x1="20" y1="80" x2="80" y2="80" stroke="rgba(255,255,255,0.06)" stroke-width="0.75" stroke-dasharray="2 2" />
  <line x1="20" y1="20" x2="20" y2="80" stroke="rgba(255,255,255,0.06)" stroke-width="0.75" stroke-dasharray="2 2" />
  <line x1="50" y1="20" x2="50" y2="80" stroke="rgba(255,255,255,0.06)" stroke-width="0.75" stroke-dasharray="2 2" />
  <line x1="80" y1="20" x2="80" y2="80" stroke="rgba(255,255,255,0.06)" stroke-width="0.75" stroke-dasharray="2 2" />

  <!-- Architectural drafting circular guide -->
  <circle cx="50" cy="50" r="32" stroke="rgba(255,255,255,0.04)" stroke-width="1" />
  <circle cx="50" cy="50" r="22" stroke="rgba(255,255,255,0.02)" stroke-width="0.75" />

  <!-- Roof/Building structure layout -->
  <path d="M22 68 L50 24 L78 68" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" stroke-linecap="round" />
  <path d="M30 68 H70" stroke="rgba(255,255,255,0.1)" stroke-width="1" />

  <!-- Distinct 'S' letter curve in brand orange -->
  <path d="M34 56 C34 49 46 49 46 43 C46 37 38 37 38 32 C38 27 48 27 48 32" stroke="#ff6b00" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Distinct 'N' letter lines in sleek studio white -->
  <path d="M54 56 V30 L66 56 V30" stroke="#f8fafc" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Small crosshair detail for engineer drafting theme -->
  <circle cx="50" cy="24" r="2" fill="#ff6b00" />
</svg>
